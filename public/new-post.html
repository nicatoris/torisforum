<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>new post · TORISFORUM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="newPost">
  <main class="wrap">
    <div class="win" style="max-width:640px;margin:40px auto 0">
      <div class="win-title">compose.exe — new transmission<div class="dots"><i></i><i></i><i></i></div></div>
      <div class="win-body" style="padding:22px">
        <div class="form-err"></div>
        <form id="post-form">
          <div class="field">
            <label for="board-select">board</label>
            <select id="board-select"></select>
          </div>
          <div class="field">
            <label for="title">title</label>
            <input type="text" id="title" maxlength="140" required placeholder="say it loud">
          </div>
          <div class="field">
            <label for="body">body <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
            <textarea id="body" maxlength="10000" placeholder="elaborate…"></textarea>
          </div>
          <div class="field">
            <label>attachment <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
            <label class="file-label"><input type="file" id="attachment"><span id="file-name">drop a file — image, clip, whatever (8MB max)</span></label>
          </div>
          <button class="btn primary" id="submit-btn" style="width:100%;justify-content:center">transmit →</button>
        </form>
      </div>
    </div>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
