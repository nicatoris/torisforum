<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New post · torisforum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="newPost">
  <main class="wrap">
    <div class="win" style="max-width:640px;margin:40px auto 0">
      <div class="win-title">New post<div class="dots"><i></i><i></i><i></i></div></div>
      <div class="win-body" style="padding:24px">
        <div class="form-err"></div>
        <form id="post-form">
          <div class="field">
            <label for="board-select">Board</label>
            <select id="board-select"></select>
          </div>
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" maxlength="140" required placeholder="What's this about?">
          </div>
          <div class="field">
            <label for="body">Body <span style="font-weight:normal">(optional)</span></label>
            <div class="md-toolbar" id="md-toolbar">
              <button type="button" data-md="bold" title="Bold"><b>B</b></button>
              <button type="button" data-md="italic" title="Italic"><i>I</i></button>
              <button type="button" data-md="strike" title="Strikethrough"><s>S</s></button>
              <button type="button" data-md="heading" title="Heading">Heading</button>
              <button type="button" data-md="link" title="Link">Link</button>
              <button type="button" data-md="quote" title="Quote">Quote</button>
              <button type="button" data-md="code" title="Code">Code</button>
              <button type="button" data-md="list" title="Bulleted list">List</button>
              <span class="mdt-sep"></span>
              <button type="button" id="md-preview-btn">Preview</button>
            </div>
            <textarea id="body" maxlength="10000" placeholder="Say more… formatting is supported, so headings, lists, quotes, links, and code all work."></textarea>
            <div id="md-preview" class="post-body md-preview" hidden></div>
            <div class="hint">Select text and use the buttons above, or write the formatting yourself: **bold**, *italic*, # headings, - lists, &gt; quotes, `code`, [links](https://…)</div>
          </div>
          <div class="field">
            <label>Attachment <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label>
            <label class="file-label"><input type="file" id="attachment"><span id="file-name">Attach a file — image, video, whatever (8MB max)</span></label>
          </div>
          <button class="btn primary" id="submit-btn" style="width:100%;justify-content:center">Post</button>
        </form>
      </div>
    </div>
  </main>
  <script src="/js/md.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
