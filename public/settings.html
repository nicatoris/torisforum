<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings · vipnet</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="settings">
  <main class="wrap">
    <div class="win form-win">
      <div class="win-title">Profile settings<div class="dots"><i></i><i></i><i></i></div></div>
      <div class="win-body roomy">
        <div class="form-err"></div>
        <div class="form-ok"></div>
        <form id="settings-form">
          <div class="field">
            <label>Avatar</label>
            <div class="avatar-edit-row">
              <div id="current-avatar"></div>
              <label class="file-label" style="flex:1"><input type="file" id="avatar" accept="image/*"><span id="avatar-name">Choose an image or GIF — you can crop it next</span></label>
            </div>
          </div>
          <div class="field">
            <label>Profile banner</label>
            <div id="current-banner" class="banner-preview"></div>
            <div class="banner-edit-row">
              <label class="file-label" style="flex:1"><input type="file" id="banner" accept="image/*"><span id="banner-name">Choose a banner image or GIF — you can crop it next</span></label>
              <button type="button" class="btn ghost" id="banner-clear">Remove</button>
            </div>
          </div>
          <div class="field">
            <label for="tagline">Nickname</label>
            <input type="text" id="tagline" maxlength="60" placeholder="e.g. night shift operator">
            <div class="hint">Shown next to your username on your profile</div>
          </div>
          <div class="field">
            <label for="bio">Bio</label>
            <textarea id="bio" maxlength="500" placeholder="Tell people a little about you"></textarea>
          </div>
          <div class="field">
            <label>Accent color</label>
            <div class="color-pick" id="color-pick"></div>
            <div class="hint">Outlines your profile picture on your profile page</div>
          </div>
          <button class="btn primary" style="width:100%;justify-content:center">Save changes</button>
        </form>
      </div>
    </div>
  </main>
  <script src="/js/crop.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
