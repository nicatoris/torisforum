<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>torisforum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="home">
  <main class="wrap">
    <div class="hero">
      <h1>torisforum</h1>
      <div class="sub">Boards for whatever you're into. Post, share files, and see what's <b>trending</b> right now.</div>
      <div class="actions" id="hero-cta"></div>
    </div>

    <div class="sec-head"><h2>Boards</h2><div class="rule"></div></div>
    <div class="board-grid" id="boards-grid"><div class="loading">loading…</div></div>

    <div class="sec-head"><h2>Trending <span class="sig">✦</span></h2><span class="tag">most active · last 14 days</span><div class="rule"></div></div>
    <div id="trending-list"><div class="loading">loading…</div></div>

    <div class="sec-head"><h2>New</h2><span class="tag">latest posts across all boards</span><div class="rule"></div></div>
    <div id="new-list"><div class="loading">loading…</div></div>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
