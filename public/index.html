<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TORISFORUM · home</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="home">
  <main class="wrap">
    <div class="hero">
      <div class="stamp">v1.0 // node online<br>signal: strong<br>uptime: ∞</div>
      <h1>TORISFORUM</h1>
      <div class="sub">the signal in the static. post to the boards, ride the trend wave, <b>make some noise</b>.</div>
      <div class="actions" id="hero-cta"></div>
    </div>

    <div class="sec-head"><h2>boards <span class="sig">//</span> channels</h2><div class="rule"></div></div>
    <div class="board-grid" id="boards-grid"><div class="loading">loading</div></div>

    <div class="sec-head" style="--accent-h:var(--magenta)"><h2>trending <span class="sig" style="color:var(--magenta)">▲</span></h2><span class="tag">hottest signals · last 14 days</span><div class="rule"></div></div>
    <div id="trending-list"><div class="loading">scanning</div></div>

    <div class="sec-head"><h2>fresh <span class="sig">⟢</span></h2><span class="tag">newest transmissions</span><div class="rule"></div></div>
    <div id="new-list"><div class="loading">loading</div></div>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
