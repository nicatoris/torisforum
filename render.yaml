services:
  - type: web
    name: vipnet
    runtime: node
    plan: starter
    branch: claude/social-media-forum-site-at497g
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/boards
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data/db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: vipnet-data
      mountPath: /var/data
      sizeGB: 1
